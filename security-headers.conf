# Encabezados de seguridad del panel. nginx descarta los add_header del servidor en
# cualquier bloque `location` que defina uno propio, así que cada bloque incluye este
# archivo (ver nginx.conf). El Dockerfile reemplaza __API_ORIGIN__ por el origen de
# VITE_API_URL al construir la imagen.
#
# Política de contenido: el panel solo carga scripts, estilos y fuentes de sí mismo y
# solo habla con su propio dominio y con la API. `data:` en imágenes es para el QR
# (se genera en el navegador). Nada de estilos ni scripts incrustados: por eso el
# marcador de carga vive en public/splash.css y no dentro de index.html.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' __API_ORIGIN__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# HTTPS siempre, durante un año. Solo lo respeta el navegador cuando la respuesta le
# llega por HTTPS (en Dokploy, Traefik pone el certificado delante de nginx).
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
