<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de administración</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Marcador de carga: se ve desde el primer instante, antes de que cargue el
         JavaScript, con el fondo del panel (sin pantalla en blanco). React lo
         reemplaza al arrancar; LoadingScreen.jsx dibuja lo mismo. Sus estilos están
         en public/splash.css y no dentro de la página: la política de contenido
         del servidor no permite estilos incrustados. Los colores repiten los
         tokens de styles.css (--bg, --text-dim, --admin). -->
    <link rel="stylesheet" href="/splash.css" />
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-live="polite">
        <svg class="splash-lock" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M22 29V22a10 10 0 0 1 20 0v7" fill="none" stroke="#4fb8ae" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
          <rect x="15" y="29" width="34" height="23" rx="5" fill="#1b1f27" stroke="#4fb8ae" stroke-width="4" />
          <circle cx="32" cy="39.5" r="3" fill="#4fb8ae" />
          <path d="M32 42v5" stroke="#4fb8ae" stroke-width="3" stroke-linecap="round" />
        </svg>
        <p class="splash-text">Cargando…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
