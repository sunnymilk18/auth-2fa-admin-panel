server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # Los archivos compilados llevan un hash en el nombre: se pueden guardar para siempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Cualquier otra ruta (/users, /blacklist…) la resuelve el router del navegador.
  # index.html no se guarda en caché: así un despliegue nuevo se ve al recargar.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri /index.html;
  }
}
