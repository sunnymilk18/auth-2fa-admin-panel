server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/security-headers.conf;

  # Los archivos compilados llevan un hash en el nombre: se pueden guardar para siempre.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Cualquier otra ruta (/users, /blacklist…) la resuelve el router del navegador.
  # index.html no se guarda en caché: así un despliegue nuevo se ve al recargar.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
